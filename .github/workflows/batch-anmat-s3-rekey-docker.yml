# ---
# Build y push de la imagen batch/anmat-s3-rekey (rekey S3 ANMAT desde disposicion).
# ECR: rag-batch-anmat-s3-rekey-prod (crear con infra/batch-alerts-semantic-matches).
#
# Secret: AWS_BATCH_ECR_ROLE_ARN (mismo rol que batch alertas; policy ECR ampliada en Terraform)
# ---

name: Batch ANMAT S3 rekey — Docker → ECR

on:
  push:
    branches:
      - main
      - master
      - tenant_boletin
    paths:
      - "scripts/rekey_anmat_s3_from_disposicion.py"
      - "batch/anmat-s3-rekey/**"

  workflow_dispatch:

concurrency:
  group: batch-anmat-s3-rekey-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: rag-batch-anmat-s3-rekey-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BATCH_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          set -eux
          docker build \
            -f batch/anmat-s3-rekey/Dockerfile \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${GITHUB_SHA}" \
            .
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${GITHUB_SHA}"

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_uri }}:latest\` and \`:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
